[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codesync-engine"
version = "0.3.0"
description = "Project-aware AI engine: variable mapping and code refinement for Python repositories"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "pathspec>=0.12"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
codesync = "codesync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
