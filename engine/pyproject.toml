[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codesync-engine"
version = "0.1.0"
description = "Project-aware static analysis engine for safe code refinement"
requires-python = ">=3.10"
dependencies = ["pathspec>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
codesync = "codesync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
