services:
  - type: web
    name: codesync-api
    runtime: docker
    dockerfilePath: ./engine/Dockerfile
    dockerContext: ./engine
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CODESYNC_API_KEYS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # The address of the site below, so its pages may call this API.
      - key: CODESYNC_CORS_ORIGINS
        sync: false
  - type: web
    name: codesync-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # The address of the API above, built into the page.
      - key: VITE_API_URL
        sync: false
